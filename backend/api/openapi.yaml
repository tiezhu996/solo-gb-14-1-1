openapi: 3.0.3
info:
  title: CodeLearn 在线编程学习平台 API
  version: 1.0.0
  description: Go 1.22 + Gin + mongo-driver 实现的在线编程学习平台后端接口。统一响应格式 { "code": 0, "message": "ok", "data": ... }。
servers:
  - url: http://localhost:3010/api/v1
paths:
  /healthz:
    get:
      summary: 健康检查
      responses:
        '200': { description: healthy }
  /auth/register:
    post:
      summary: 注册
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: ok }
  /auth/login:
    post:
      summary: 登录
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: ok }
  /auth/sign-in:
    post:
      summary: 每日签到
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /users/me:
    get:
      summary: 获取当前用户
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /courses:
    get:
      summary: 课程列表
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
    post:
      summary: 创建课程（管理员）
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /problems:
    get:
      summary: 题目列表
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
    post:
      summary: 创建题目（管理员）
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /problems/{id}/submit:
    post:
      summary: 提交代码评测
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
  /submissions:
    get:
      summary: 提交记录列表
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /problems/{id}/discussions:
    get:
      summary: 题目讨论区
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
    post:
      summary: 发布讨论
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /leaderboard:
    get:
      summary: 排行榜（daily/weekly/total）
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [daily, weekly, total] } }
      responses:
        '200': { description: ok }
  /achievements/me:
    get:
      summary: 我的成就
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /dashboard/me:
    get:
      summary: 个人学习仪表盘
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /audits:
    get:
      summary: 审计日志（管理员）
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /mistakes:
    get:
      summary: 错题列表（按题目关键词 q、知识点 knowledge_point、掌握状态 mastery、到期 due_only 筛选）
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: knowledge_point, in: query, schema: { type: string } }
        - { name: mastery, in: query, schema: { type: string, enum: [unmastered, learning, mastered] } }
        - { name: due_only, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: ok }
    post:
      summary: 收录错题（记录错误原因与复盘结论，可设置下次复习日期）
      security: [ { bearerAuth: [] } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string }, problem_id: { type: string }, knowledge_points: { type: array, items: { type: string } }, error_reason: { type: string }, review_note: { type: string }, mastery: { type: string, enum: [unmastered, learning, mastered] }, next_review_at: { type: string, example: '2026-09-20' } } } } } }
      responses:
        '200': { description: ok }
  /mistakes/due:
    get:
      summary: 到期待复习提醒列表
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /mistakes/knowledge-points:
    get:
      summary: 当前用户错题知识点清单（去重）
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: ok }
  /mistakes/{id}:
    get:
      summary: 错题详情
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
    put:
      summary: 修改错题（未提供的字段保持原值，掌握状态保留）
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: ok }
    delete:
      summary: 移除错题（仅删除该记录，不影响其他记录的掌握状态）
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
  /mistakes/{id}/review:
    post:
      summary: 完成一次复习（更新掌握状态，缺省按 1/3/7 天自动排期下次复习）
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { content: { application/json: { schema: { type: object, required: [mastery], properties: { mastery: { type: string, enum: [unmastered, learning, mastered] }, next_review_at: { type: string, example: '2026-09-20' } } } } } }
      responses:
        '200': { description: ok }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
